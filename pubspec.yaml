name: TALLeaders
description: "A professional Flutter app with clean architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get:
  dio: ^5.0.0
  internet_connection_checker: ^0.0.1
  flutter_native_splash: ^2.4.6
  get_storage: ^2.0.3
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^4.0.1
  flutter_custom_tabs: ^2.1.0
  flutter_svg: ^2.0.6
  intl: ^0.18.0
  cached_network_image: ^3.2.3
  google_fonts: ^4.0.3
  url_launcher: ^6.3.1
  chips_choice: ^3.0.1
  firebase_core: ^3.14.0
  firebase_storage: ^12.4.7
  firebase_database: ^11.3.7
  flutter_typeahead: ^4.8.0
  share_plus: ^7.2.2
  image_picker: ^1.0.7
  country_code_picker: ^3.0.0
  fluttertoast: ^8.2.4
  flutter_keyboard_visibility: ^5.4.1

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFFFFF"
  color_dark: "#272727"
  image: assets/app_logo.png
  image_dark: assets/app_logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#272727"
    image: assets/app_logo.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#272727"
  android_gravity: center

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher.png"
  adaptive_icon_background: "#ffffff"
  min_sdk: 21
  remove_alpha_ios: true

dev_dependencies:
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/